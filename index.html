<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCIY 的主页</title>
<style>
  .add-skill {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.add-skill input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #DDDDDD;
  border-radius: 6px;
  font-size: 14px;
}

.add-skill button {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background-color: #373796;
  color: #FFFFFF;
  font-size: 14px;
  cursor: pointer;
}
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 800px;
  margin: 0 auto;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 24px;
}

.nav-links a {
  color: #FFFFFF;
  text-decoration: none;
}
 body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #F4F4F7;
      color : #222222;
}
main {
     max-width: 800px;
     margin: 0 auto;
     padding: 40px 20px;
}
header {
    background-color:  #1F1F2E;
    color: #FFFFFF;
    padding: 48px 20px;
    text-align: center;
}
   section {
  background-color: #FFFFFF;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
}
.skills {
  display: flex;
  gap: 12px;
  justify-content : center;
}
footer {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      color: #888888;
 }
h2 { 
   margin-top : 0 ;
}
.skills span {
  background-color: #EFEFF2;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 14px;
}
@media (max-width: 600px) {
  main {
    padding: 20px 12px;
  }

  header {
    padding: 28px 12px;
  }

  .navbar {
    padding: 0 12px;
  }

  .nav-links {
    gap: 16px;
  }
}
.skills span.active {
  background-color: #373796;
  color: #FFFFFF;
}
.skills span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.skills span .del {
  border: none;
  background: transparent;
  color: #999999;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  cursor: pointer;
}

.skills span .del:hover {
  color: #D14343;
}
</style>
</head>
<body>

 <header>
  <nav class="navbar">
    <span class="logo">CGY</span>
    <div class="nav-links">
      <a href="#about">关于我</a>
      <a href="#skills">技能</a>
    </div>
  </nav>
</header>

  <main>
    <section id="about">
      <h2>关于我 </h2>
 
      <p  class ="intro">21岁的工程师</p>
    </section>

    <section id="skills">
  <h2>我会的技能</h2>
  <div class="skills"></div>
  <div class="add-skill">
  <input type="text" id="skillInput" placeholder="输入技能名称">
  <button id="addBtn">添加</button>
</div>
</section>
  </main>

  <footer>
    <p>联系方式：1751318491</p>
 
  </footer>
  <script src="script.js"></script>
  

</body>
</html>
